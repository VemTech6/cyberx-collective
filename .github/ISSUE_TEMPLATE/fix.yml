name: 🔧 Fix
description: Report a broken link, outdated info, a typo, or a formatting error. No PR needed — a maintainer pushes the fix.
title: "[Fix]: "
labels: ["fix"]
body:
  - type: dropdown
    id: type
    attributes:
      label: What kind of fix?
      options:
        - Broken or dead link
        - Outdated information (program/tool changed, renamed, or deprecated)
        - Typo
        - Formatting error (breaks rendering)
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where is it?
      description: File and section — e.g. start-here/README.md, "Offensive Security" track
      placeholder: file.md, section name
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: What's there now?
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: What should it say instead?
    validations:
      required: true
